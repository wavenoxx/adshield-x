name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Gradient-check the autodiff engine
        run: python tests/test_autodiff.py

      - name: Smoke-test the pipeline
        run: python run_pipeline.py --quick --stage 1

      - name: Smoke-test the console
        run: python tests/test_app.py
